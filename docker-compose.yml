name: payment-system-saga

x-runtime-environment: &runtime-environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  PAYMENT_COMMANDS_TOPIC: payments.commands.v1
  PAYMENT_EVENTS_TOPIC: payments.events.v1
  INVENTORY_COMMANDS_TOPIC: inventory.commands.v1
  INVENTORY_EVENTS_TOPIC: inventory.events.v1
  DLQ_TOPIC: saga.dlq.v1
  MESSAGE_RETRY_ATTEMPTS: "3"
  MESSAGE_BACKOFF_SECONDS: 1,2,4
  OUTBOX_POLL_SECONDS: "0.5"
  OUTBOX_BATCH_SIZE: "100"
  LOG_LEVEL: INFO

x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile
  target: runtime

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga-local-only
      POSTGRES_DB: postgres
    ports:
      - "55439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "19092:19092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  order-migrate:
    build: *app-build
    command:
      [
        "alembic",
        "-c",
        "services/order_service/alembic.ini",
        "upgrade",
        "head",
      ]
    environment:
      ORDER_DATABASE_URL: postgresql+asyncpg://saga:saga-local-only@postgres:5432/orders
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  payment-migrate:
    build: *app-build
    command:
      [
        "alembic",
        "-c",
        "services/payment_service/alembic.ini",
        "upgrade",
        "head",
      ]
    environment:
      PAYMENT_DATABASE_URL: postgresql+asyncpg://saga:saga-local-only@postgres:5432/payments
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  inventory-migrate:
    build: *app-build
    command:
      [
        "alembic",
        "-c",
        "services/inventory_service/alembic.ini",
        "upgrade",
        "head",
      ]
    environment:
      INVENTORY_DATABASE_URL: postgresql+asyncpg://saga:saga-local-only@postgres:5432/inventory
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  order-service:
    build: *app-build
    command:
      [
        "uvicorn",
        "services.order_service.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      <<: *runtime-environment
      ORDER_DATABASE_URL: postgresql+asyncpg://saga:saga-local-only@postgres:5432/orders
    ports:
      - "18000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 15s
    restart: unless-stopped

  payment-service:
    build: *app-build
    command:
      [
        "uvicorn",
        "services.payment_service.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    environment:
      <<: *runtime-environment
      PAYMENT_DATABASE_URL: postgresql+asyncpg://saga:saga-local-only@postgres:5432/payments
      REFUND_TRANSIENT_FAILURE_AMOUNT_MINOR: "7777"
    ports:
      - "18001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      payment-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 15s
    restart: unless-stopped

  inventory-service:
    build: *app-build
    command:
      [
        "uvicorn",
        "services.inventory_service.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
      ]
    environment:
      <<: *runtime-environment
      INVENTORY_DATABASE_URL: postgresql+asyncpg://saga:saga-local-only@postgres:5432/inventory
    ports:
      - "18002:8002"
    depends_on:
      kafka:
        condition: service_healthy
      inventory-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
