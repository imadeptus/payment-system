name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --editable '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy libs services
      - name: Unit tests
        run: pytest tests/unit -q

  integration-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --editable '.[dev]'
      - name: Start PostgreSQL and Kafka
        run: docker compose up -d --wait postgres kafka
      - name: Unit and PostgreSQL integration coverage
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://saga:saga-local-only@127.0.0.1:55439/postgres
        run: >-
          pytest tests/unit tests/integration
          --cov=libs --cov=services
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Build and start complete Saga topology
        run: docker compose up -d --build --wait
      - name: Containerized Kafka and failure-path tests
        env:
          E2E_ORDER_BASE_URL: http://127.0.0.1:18000
          E2E_RUN_RECOVERY: "1"
        run: pytest tests/e2e -q
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Teardown
        if: always()
        run: docker compose down -v
